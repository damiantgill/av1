<html lang="en">

<title>Adventure</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #2b2622;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage svg {
    display: block;
    height: 100vh;
    max-width: 100vw;
    width: auto;
  }

  /* Generic fade-in / fade-out for toggled elements */
  #shield, #tie, #helmet, #door,
  #shield-button, #tie-button, #helmet-button {
    transition: opacity 0.4s ease;
  }
  .hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* Buttons: glow yellow on hover */
  #shield-button, #tie-button, #helmet-button {
    cursor: pointer;
    transition: opacity 0.4s ease, filter 0.2s ease;
  }
  #shield-button:hover, #tie-button:hover, #helmet-button:hover,
  #shield-button:focus-visible, #tie-button:focus-visible, #helmet-button:focus-visible {
    outline: none;
    filter: drop-shadow(0 0 6px #ffe600) drop-shadow(0 0 14px #ffd500);
  }

  /* Hall: slow glowing pulse once all buttons have been clicked */
  #hall.glowing {
    cursor: pointer;
    animation: hall-pulse 3s ease-in-out infinite;
  }
  @keyframes hall-pulse {
    0%, 100% { filter: drop-shadow(0 0 2px rgba(255, 221, 120, 0.25)); fill: #4C4C4C; }
    50%      { filter: drop-shadow(0 0 12px rgba(255, 221, 120, 0.8)); fill: #5d5850; }
  }
  #hall.entered {
    cursor: default;
  }

  /* Hero walks to the door, shrinking with distance, then fades away */
  #hero {
    transform-box: view-box;
    transform-origin: 236.5px 763px; /* bottom-centre of the hero */
    transition: transform 3s ease-in-out, opacity 1.2s ease;
  }
  #hero.walking {
    /* bottom-centre lands at the bottom-centre of the door (232, 378) */
    transform: translate(-4.5px, -385px) scale(0.65);
  }
  #hero.walking > * {
    animation: hero-bob 0.5s ease-in-out infinite;
  }
  #hero.arrived > * {
    animation: none;
  }
  #hero.gone {
    opacity: 0;
  }
  /* Castle shakes when the hero enters, then settles down */
  #castle-shake {
    transform-box: view-box;
    transform-origin: 189.5px 378px; /* bottom-centre of the castle */
  }
  #castle-shake.shaking {
    animation: castle-shake 1.2s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
  }
  @keyframes castle-shake {
    0%   { transform: translate(0, 0) rotate(0); }
    10%  { transform: translate(-6px, 1px) rotate(-1.2deg); }
    20%  { transform: translate(6px, -1px) rotate(1.1deg); }
    30%  { transform: translate(-5px, 1px) rotate(-0.9deg); }
    40%  { transform: translate(4px, 0) rotate(0.7deg); }
    50%  { transform: translate(-3px, 1px) rotate(-0.5deg); }
    60%  { transform: translate(2px, 0) rotate(0.35deg); }
    70%  { transform: translate(-1.5px, 0) rotate(-0.2deg); }
    80%  { transform: translate(1px, 0) rotate(0.1deg); }
    90%  { transform: translate(-0.5px, 0) rotate(0); }
    100% { transform: translate(0, 0) rotate(0); }
  }
  @keyframes hero-bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }
</style>
</head>

<script>
(function () {
  const $ = (id) => document.getElementById(id);

  const hall = $('hall');
  const door = $('door');
  const hero = $('hero');

  // Group the castle with its hall (and door) so they shake together
  const castle = $('Castle');
  const castleShake = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  castleShake.id = 'castle-shake';
  castle.parentNode.insertBefore(castleShake, castle);
  castleShake.append(castle, hall, door);

  const toggles = {
    'shield-button': $('shield'),
    'tie-button': $('tie'),
    'helmet-button': $('helmet'),
  };
  const buttons = Object.keys(toggles).map($);

  // At start: equipment is not visible
  Object.values(toggles).forEach((el) => el.classList.add('hidden'));

  const clicked = new Set();
  let doorOpen = false;
  let entered = false;

  function press(button) {
    toggles[button.id].classList.toggle('hidden');
    clicked.add(button.id);

    // When all buttons have been clicked: door disappears, hall pulses
    if (!doorOpen && clicked.size === buttons.length) {
      doorOpen = true;
      door.classList.add('hidden');
      hall.classList.add('glowing');
    }
  }

  buttons.forEach((button) => {
    button.setAttribute('role', 'button');
    button.setAttribute('tabindex', '0');
    button.setAttribute('aria-label', 'Toggle ' + button.id.replace('-button', ''));
    button.addEventListener('click', () => press(button));
    button.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        press(button);
      }
    });
  });

  // When the door is gone: clicking the hall sends the hero inside
  hall.addEventListener('click', () => {
    if (!doorOpen || entered) return;
    entered = true;

    buttons.forEach((b) => {
      b.classList.add('hidden');
      b.setAttribute('tabindex', '-1');
    });
    hall.classList.add('entered');

    hero.classList.add('walking');
    hero.addEventListener('transitionend', function onArrive(e) {
      if (e.target !== hero || e.propertyName !== 'transform') return;
      hero.removeEventListener('transitionend', onArrive);
      hero.classList.add('arrived', 'gone');
      castleShake.classList.add('shaking');
    });
  });
})();
</script>
